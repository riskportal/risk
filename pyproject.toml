[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-network"
dynamic = ["version"]
description = "RISK (Regional Inference of Significant Kinships): a Python tool for biological network annotation, enrichment analysis, community detection, and visualization."
authors = [
    { name = "Ira Horecka", email = "ira89@icloud.com" },
]
keywords = [
    "bioinformatics",
    "network-analysis",
    "systems-biology",
    "community-detection",
    "graph-clustering",
    "enrichment-analysis",
    "gene-ontology",
    "cytoscape",
    "visualization",
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "ipywidgets",
    # Keep Leiden on 0.10.x until migration to igraph 1.x.
    "leidenalg>=0.10,<0.11",
    "markov_clustering",
    "matplotlib",
    "networkx",
    "nltk",
    "numpy>=1.21",
    "openpyxl",
    "pandas>=1.3",
    # Leiden 0.10.x depends on igraph <0.12.
    "igraph>=0.11,<0.12",
    "python-louvain",
    "scikit-learn>=1.0",
    "scipy",
    "statsmodels",
    "threadpoolctl>=3.1",
    "tqdm",
]

[project.license]
text = "GPL-3.0-or-later"

[project.urls]
Homepage = "https://github.com/riskportal/risk"
Documentation = "https://riskportal.github.io/risk-docs/"
Issues = "https://github.com/riskportal/risk/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "risk.__version__" }

[tool.pytest.ini_options]
pythonpath = ["src"]
